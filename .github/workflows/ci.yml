name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Functions, rules and emulator tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm install -g firebase-tools
      - run: npm run lint
      - run: npm run build
      - run: npm run test:unit
      - run: npm run test:rules

  app:
    name: Flutter analyze, test and Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - run: flutter test
      # Builds without Firebase keys; the app shows its "not configured" screen.
      # Release builds with real keys and signing are set up in docs/RELEASE.md (Sprint 7).
      - run: flutter build apk --debug --dart-define=ATMS_ENV=dev
      - name: Report APK size
        run: ls -lh build/app/outputs/flutter-apk/
      - uses: actions/upload-artifact@v4
        with:
          name: atms-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
